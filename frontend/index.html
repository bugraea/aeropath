<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AEROPATH - Yapay Zeka Destekli Afet Navigasyon ve Koordinasyon Sistemi. Yetkili personel giriş paneli.">
    <title>AEROPATH | Yetkili Personel Girişi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <!-- Animated Background Canvas -->
    <canvas id="networkCanvas"></canvas>

    <!-- Topographic Overlay -->
    <div class="topo-overlay"></div>

    <!-- Scan Line Effect -->
    <div class="scanline"></div>

    <!-- Main Login Container -->
    <main class="login-container" role="main">
        <div class="login-card" id="loginCard">

            <!-- Logo & Branding -->
            <div class="brand-section">
                <div class="logo-container">
                    <div class="logo-ring">
                        <div class="logo-ring-inner"></div>
                        <svg class="logo-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <!-- Hexagonal Shield -->
                            <path d="M32 4L56 18V46L32 60L8 46V18L32 4Z" stroke="#3B82F6" stroke-width="1.5" fill="none" opacity="0.3"/>
                            <path d="M32 10L50 21V43L32 54L14 43V21L32 10Z" stroke="#3B82F6" stroke-width="1" fill="none" opacity="0.15"/>
                            <!-- Compass / Navigation Arrow -->
                            <path d="M32 16L38 32L32 48L26 32L32 16Z" fill="#3B82F6" opacity="0.8"/>
                            <path d="M32 16L38 32L32 28L26 32L32 16Z" fill="#60A5FA"/>
                            <!-- Crosshair lines -->
                            <line x1="32" y1="8" x2="32" y2="20" stroke="#3B82F6" stroke-width="0.75" opacity="0.5"/>
                            <line x1="32" y1="44" x2="32" y2="56" stroke="#3B82F6" stroke-width="0.75" opacity="0.5"/>
                            <line x1="12" y1="32" x2="24" y2="32" stroke="#3B82F6" stroke-width="0.75" opacity="0.5"/>
                            <line x1="40" y1="32" x2="52" y2="32" stroke="#3B82F6" stroke-width="0.75" opacity="0.5"/>
                            <!-- Center dot -->
                            <circle cx="32" cy="32" r="2" fill="#60A5FA"/>
                        </svg>
                    </div>
                </div>
                <h1 class="brand-name">AEROPATH</h1>
                <p class="brand-tagline">Yetkili Personel Girişi</p>
                <p class="brand-subtitle">Afet Navigasyon ve Koordinasyon Sistemi</p>
            </div>

            <!-- Separator -->
            <div class="separator">
                <div class="separator-line"></div>
                <div class="separator-diamond"></div>
                <div class="separator-line"></div>
            </div>

            <!-- Login Form -->
            <form class="login-form" id="loginForm" autocomplete="off" novalidate>
                <!-- Badge ID Field -->
                <div class="form-group" id="badgeGroup">
                    <label class="form-label" for="badgeId">
                        <span class="label-text">Rozet Numarası / Kimlik</span>
                        <span class="label-required">ZORUNLU</span>
                    </label>
                    <div class="input-wrapper">
                        <div class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                        </div>
                        <input 
                            type="text" 
                            id="badgeId" 
                            class="form-input" 
                            placeholder="AP-XXXX-XXXX"
                            autocomplete="off"
                            spellcheck="false"
                            required
                        >
                        <div class="input-focus-border"></div>
                    </div>
                </div>

                <!-- Password Field -->
                <div class="form-group" id="passwordGroup">
                    <label class="form-label" for="password">
                        <span class="label-text">Şifre</span>
                        <span class="label-required">ZORUNLU</span>
                    </label>
                    <div class="input-wrapper">
                        <div class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                        </div>
                        <input 
                            type="password" 
                            id="password" 
                            class="form-input" 
                            placeholder="••••••••••"
                            autocomplete="off"
                            required
                        >
                        <button type="button" class="password-toggle" id="passwordToggle" aria-label="Şifre görünürlüğünü değiştir">
                            <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                        <div class="input-focus-border"></div>
                    </div>
                </div>

                <!-- Forgot Password -->
                <div class="forgot-password-row">
                    <a href="#" class="forgot-link" id="forgotPassword">Şifrenizi mi unuttunuz?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="submit-btn" id="submitBtn">
                    <span class="btn-text">Sisteme Eriş</span>
                    <span class="btn-loader" style="display:none;">
                        <svg class="spinner" width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="31.4 31.4" stroke-dashoffset="0"/>
                        </svg>
                    </span>
                    <span class="btn-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 12h14"/>
                            <path d="M12 5l7 7-7 7"/>
                        </svg>
                    </span>
                </button>
            </form>

            <!-- Security Classification -->
            <div class="classification-bar">
                <span class="classification-text">GİZLİLİK SEVİYESİ: SINIFLI</span>
            </div>
        </div>

        <!-- System Status Footer -->
        <footer class="system-footer">
            <div class="status-indicator" id="statusIndicator">
                <span class="status-dot"></span>
                <span class="status-text">Sistem Durumu: Çevrimiçi</span>
                <span class="status-separator">|</span>
                <span class="status-secure">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    </svg>
                    Güvenli Bağlantı Kuruldu
                </span>
            </div>
            <div class="footer-meta">
                <span class="meta-item">TLS 1.3 / AES-256</span>
                <span class="meta-separator">•</span>
                <span class="meta-item" id="currentTime"></span>
                <span class="meta-separator">•</span>
                <span class="meta-item">v3.7.1</span>
            </div>
        </footer>
    </main>

    <script src="index.js"></script>
</body>
</html>
